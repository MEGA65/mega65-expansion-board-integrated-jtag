# MEGA65 Expansion Board Integrated JTAG Firmware & Utilities remote config.
#
# Status: v0.1 experimental. WiFi enablement, HTTP endpoints, config keys,
# permission rules, signing policy, and autofetch behaviour are all still
# subject to change.
#
# Copy this to mega65-jtag.cfg and edit it on the SD card to enable WiFi HTTP.
# No mega65-jtag.cfg means no WiFi remote service.

ssid=YourWifiSSID
psk=YourWifiPassword

# DHCP is the default. For static addressing, set dhcp=0 and fill these in.
dhcp=1
# ip=192.168.1.65
# netmask=255.255.255.0
# gateway=192.168.1.1

http=1
http_port=80

# GET /identity is always unauthenticated and returns only r3:name, r6:name,
# or r0:name so host tools can discover named boards.

# Optional HTTP Basic auth. Leave unset to rely on the IP allow-list only.
# http_user=mega65
# http_password=programmer

# Default is yes. Set to 0 only for trusted bench networks.
require_write_grant=1

# Optional signed upload/fetch enforcement. trusted_key is a raw uncompressed
# P-256 public key: 04 || X(32 bytes) || Y(32 bytes), hex encoded.
# require_signatures=1
# trusted_key=p256:04...
# gardners mirror key as of 2026-07-19
trusted_key=p256:0485f7b2b81701674dfe0622952b06ae44f37c48065c1f15dd1e823358f41a6c56a6c0ba15cd8a65b059edb679a8005ce45cee752c3345b25493f4c7a9cd6be782

# Optional unattended core/firmware/theme updates. The firmware fetches
# <fetch_channel>-r<fetch_board>.sha256 from fetch_base_url, verifies the signed
# typed manifest, and then fetches only changed signed entries. Core files are
# stored by their manifest paths; firmware/theme packages use fixed safe
# destinations in DOWNLOADS/. Minimum interval is 3 hours.
# autofetch=0
# fetch_interval_hours=3
# fetch_board=6
# fetch_channel=stable
fetch_base_url=http://203.28.176.50:64738

# CIDR allow rules. files controls GET/PUT /files, bitstreams controls /jtag.
# allow=192.168.1.0/24 files=1 bitstreams=1
