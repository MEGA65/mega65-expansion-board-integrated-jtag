<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="{FETCH_REFRESH_SECONDS}">
  <title>MEGA65 JTAG Fetch Busy</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(124, 8, 8, 0.28), rgba(9, 12, 17, 0) 44%),
        #090c11;
      color: #e8edf3;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(780px, calc(100vw - 32px));
      margin: 48px auto;
    }

    .panel {
      padding: 30px;
      background: linear-gradient(180deg, #111821 0%, #0b1017 100%);
      border: 1px solid #273142;
      border-left: 6px solid #ffd34d;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }

    h1 {
      margin: 0 0 6px;
      color: #ffd34d;
      font-size: 32px;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 44, 44, 0.45);
    }

    .subhead {
      margin-bottom: 16px;
      color: #ff8d5c;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status {
      padding: 12px 14px;
      overflow-wrap: anywhere;
      background: #141b25;
      border: 1px solid #273142;
      color: #b9c7d8;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    .bar {
      height: 46px;
      margin: 22px 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 211, 77, 0.12), rgba(114, 8, 8, 0.18)),
        #120709;
      border: 2px solid #ffd34d;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(205, 18, 18, 0.42);
    }

    .fill {
      width: {FETCH_PERCENT}%;
      min-width: 4px;
      max-width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        135deg,
        #ffd34d 0,
        #ffd34d 18px,
        #d51c1c 18px,
        #d51c1c 36px,
        #6e0909 36px,
        #6e0909 54px
      );
      background-size: 76px 76px;
      box-shadow:
        inset 0 0 14px rgba(255, 255, 255, 0.28),
        0 0 18px rgba(255, 44, 44, 0.7);
      animation: core-stripes 0.42s linear infinite, core-glow 0.78s ease-in-out infinite alternate;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .cell {
      min-width: 0;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      background: #141b25;
      border: 1px solid #273142;
    }

    .cell strong {
      display: block;
      margin-bottom: 4px;
      color: #ffffff;
      font-size: 12px;
      text-transform: uppercase;
    }

    button {
      margin-top: 22px;
      padding: 12px 16px;
      background: #a43838;
      border: 0;
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
    }

    @keyframes core-stripes {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 76px 0;
      }
    }

    @keyframes core-glow {
      from {
        filter: saturate(1.05) brightness(1);
      }

      to {
        filter: saturate(1.45) brightness(1.2);
      }
    }

    @media (max-width: 620px) {
      main {
        margin: 22px auto;
      }

      .panel {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Fetching cores</h1>
      <div class="subhead">{FETCH_ACTION}</div>
      <div class="status">{FETCH_STATUS}</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="grid">
        <div class="cell"><strong>Stage</strong>{FETCH_STAGE}</div>
        <div class="cell"><strong>File</strong>{FETCH_FILE}</div>
        <div class="cell"><strong>Manifest</strong>{FETCH_CHECKED}/{FETCH_TOTAL} checked</div>
        <div class="cell"><strong>Updates</strong>{FETCH_NEEDED} needed / {FETCH_UPDATED} completed</div>
        <div class="cell"><strong>{FETCH_PROGRESS_LABEL}</strong>{FETCH_BYTES}/{FETCH_TOTAL_BYTES} bytes</div>
        <div class="cell"><strong>Average rate</strong>{FETCH_RATE_KIBPS} KiB/s</div>
      </div>
      <form method="get" action="/fetch/stop">
        <button type="submit">Stop fetch</button>
      </form>
    </section>
  </main>
</body>
</html>
